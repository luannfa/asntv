<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Corporativa</title>
  <style>
    /* ─── RESET ─────────────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ─── LOADING / ERRO ─────────────────────────────────── */
    #screen-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      text-align: center;
      padding: 32px;
    }
    #screen-loading .logo {
      font-size: 52px;
      margin-bottom: 8px;
    }
    #screen-loading .status {
      font-size: 15px;
      color: rgba(255,255,255,.55);
      max-width: 480px;
      line-height: 1.6;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #2c83e9;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ─── DISPLAY PRINCIPAL ──────────────────────────────── */
    #screen-player {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }

    #content-wrap {
      width: 100%;
      height: 100%;
      background: #000;
      position: relative;
    }

    /* imagem */
    #content-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }

    /* vídeo nativo */
    #content-wrap video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }

    /* iframe (Canva / PDF / YouTube embed) */
    #content-wrap iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* ─── BARRA DE PROGRESSO ────────────────────────────── */
    #progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 4px;
      width: 0%;
      background: #2c83e9;
      z-index: 200;
      transition: none;
    }

    /* ─── OVERLAY DE CONTROLES ──────────────────────────── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity .35s;
    }
    #overlay.visible {
      opacity: 1;
      pointer-events: all;
    }

    /* topo */
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      background: linear-gradient(to bottom, rgba(0,0,0,.72) 0%, transparent 100%);
    }
    #topbar .channel-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,.55);
    }
    #topbar .content-title {
      font-size: 13px;
      color: rgba(255,255,255,.7);
      max-width: 50%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-align: center;
    }
    #topbar .controls {
      display: flex;
      gap: 8px;
    }
    .ctrl-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.28); }

    /* indicadores de slide */
    #dots {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 7px;
      max-width: 90vw;
      flex-wrap: wrap;
      justify-content: center;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .dot.active {
      background: #fff;
      transform: scale(1.3);
    }

    /* contador */
    #counter {
      position: absolute;
      bottom: 14px;
      right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,.38);
    }
  </style>
</head>
<body>

<!-- TELA DE CARREGAMENTO / ERRO -->
<div id="screen-loading">
  <div class="logo">📺</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status-text">Iniciando o sistema…</div>
</div>

<!-- PLAYER PRINCIPAL -->
<div id="screen-player">
  <div id="content-wrap"></div>

  <div id="overlay">
    <div id="topbar">
      <span class="channel-label" id="channel-label">—</span>
      <span class="content-title" id="content-title"></span>
      <div class="controls">
        <button class="ctrl-btn" onclick="prevItem()">&#8592; Anterior</button>
        <button class="ctrl-btn" onclick="nextItem()">Próximo &#8594;</button>
        <button class="ctrl-btn" id="fs-btn" onclick="toggleFullscreen()">&#9974; Tela Cheia</button>
      </div>
    </div>
    <div id="dots"></div>
    <div id="counter"></div>
  </div>
</div>

<div id="progress-bar"></div>

<script>
/* ═══════════════════════════════════════════════════════════
   CONFIGURAÇÕES  –  altere aqui se necessário
═══════════════════════════════════════════════════════════ */
const WP_SITE          = 'https://asnsedu.wordpress.com';
const DEFAULT_DURATION = 15;   // segundos por item (padrão)
const REFRESH_EVERY    = 300;  // recarregar conteúdo do WP a cada X segundos
const OVERLAY_TIMEOUT  = 3500; // ms para esconder controles depois do mouse parar

/* ═══════════════════════════════════════════════════════════
   ESTADO
═══════════════════════════════════════════════════════════ */
let items        = [];
let currentIdx   = 0;
let slideTimer   = null;
let overlayTimer = null;
let isPaused     = false;

/* ═══════════════════════════════════════════════════════════
   INICIALIZAÇÃO
═══════════════════════════════════════════════════════════ */
const params      = new URLSearchParams(window.location.search);
const channelSlug = params.get('canal') || params.get('channel') || '';

if (!channelSlug) {
  showError(
    'Parâmetro <strong>canal</strong> não informado na URL.<br>' +
    'Exemplo: <code>tv-viewer.html?canal=recepcao</code>'
  );
} else {
  setStatus('Conectando ao WordPress…');
  loadChannel().then(() => {
    setInterval(silentRefresh, REFRESH_EVERY * 1000);
  });
}

/* ═══════════════════════════════════════════════════════════
   CARREGAMENTO DE DADOS
═══════════════════════════════════════════════════════════ */
async function loadChannel() {
  try {
    setStatus('Buscando canal no WordPress…');

    // 1. Buscar a categoria pelo slug
    const catRes  = await fetch(`${WP_SITE}/wp-json/wp/v2/categories?slug=${encodeURIComponent(channelSlug)}&_fields=id,name,slug`);
    const catJson = await catRes.json();

    if (!catJson || catJson.length === 0) {
      showError(
        `Canal <strong>"${channelSlug}"</strong> não encontrado.<br>` +
        `Crie uma Categoria com esse slug no WordPress e publique posts nela.`
      );
      return;
    }

    const cat = catJson[0];
    document.getElementById('channel-label').textContent = cat.name;
    document.title = `TV – ${cat.name}`;

    setStatus(`Canal encontrado: ${cat.name}. Carregando conteúdo…`);

    // 2. Buscar posts da categoria (ordem pelo menu_order ou data)
    const postsRes  = await fetch(
      `${WP_SITE}/wp-json/wp/v2/posts` +
      `?categories=${cat.id}&_embed&per_page=100&status=publish` +
      `&orderby=menu_order&order=asc` +
      `&_fields=id,title,excerpt,content,tags,_links,_embedded`
    );
    const posts = await postsRes.json();

    if (!posts || posts.length === 0) {
      showError(
        `Nenhum post encontrado no canal <strong>"${cat.name}"</strong>.<br>` +
        `Publique posts nessa categoria para criar a programação.`
      );
      return;
    }

    const parsed = posts.map(parsePost).filter(Boolean);

    if (parsed.length === 0) {
      showError(
        `Posts encontrados, mas nenhum tem conteúdo configurado corretamente.<br>` +
        `Verifique o guia de configuração.`
      );
      return;
    }

    items = parsed;
    startPlayer();

  } catch (err) {
    showError(`Erro ao carregar: ${err.message}`);
  }
}

async function silentRefresh() {
  try {
    const catRes  = await fetch(`${WP_SITE}/wp-json/wp/v2/categories?slug=${encodeURIComponent(channelSlug)}&_fields=id`);
    const catJson = await catRes.json();
    if (!catJson || catJson.length === 0) return;

    const postsRes = await fetch(
      `${WP_SITE}/wp-json/wp/v2/posts` +
      `?categories=${catJson[0].id}&_embed&per_page=100&status=publish` +
      `&orderby=menu_order&order=asc` +
      `&_fields=id,title,excerpt,content,tags,_links,_embedded`
    );
    const posts = await postsRes.json();
    const parsed = posts.map(parsePost).filter(Boolean);
    if (parsed.length > 0) {
      items = parsed;
      rebuildDots();
    }
  } catch (_) { /* falha silenciosa */ }
}

/* ═══════════════════════════════════════════════════════════
   PARSING DE POST  →  item {type, url, duration, title}
═══════════════════════════════════════════════════════════ */
function parsePost(post) {
  try {
    /* ─ Tags ─ */
    const tagTerms = post._embedded?.['wp:term']?.[1] || [];
    const tagSlugs = tagTerms.map(t => t.slug.toLowerCase());

    /* ─ Tipo ─ (tag tipo-XXX  ou  tipo: XXX) */
    let type = detectType(tagSlugs, post);

    /* ─ Duração ─ (tag duracao-XX  ou  duration-XX) */
    let duration = DEFAULT_DURATION;
    const durTag = tagSlugs.find(t => /^(duracao|duration)-\d+$/.test(t));
    if (durTag) {
      const secs = parseInt(durTag.split('-').pop(), 10);
      if (secs > 0) duration = secs;
    }

    /* ─ URL ─ (excerpt → primeiro link no conteúdo → imagem destacada) */
    let url = stripHtml(post.excerpt?.rendered || '').trim();

    if (!url) {
      // procura primeiro link no corpo
      const m = (post.content?.rendered || '').match(/https?:\/\/[^\s"<>]+/);
      if (m) url = m[0];
    }

    /* ─ Imagem destacada ─ */
    const featuredImage = post._embedded?.['wp:featuredmedia']?.[0]?.source_url || '';

    /* se tipo=imagem e sem URL, usar featured image */
    if (!url && (type === 'image') && featuredImage) url = featuredImage;

    if (!url) return null;

    /* ajustes automáticos de URL */
    url = normalizeUrl(url, type);

    return {
      id      : post.id,
      title   : stripHtml(post.title?.rendered || ''),
      type,
      url,
      duration,
    };
  } catch (_) {
    return null;
  }
}

function detectType(tagSlugs, post) {
  if (tagSlugs.some(t => /^(tipo-canva|canva)$/.test(t)))           return 'iframe';
  if (tagSlugs.some(t => /^(tipo-pdf|pdf)$/.test(t)))               return 'iframe';
  if (tagSlugs.some(t => /^(tipo-iframe|iframe|web|site)$/.test(t))) return 'iframe';
  if (tagSlugs.some(t => /^(tipo-video|video)$/.test(t)))            return 'video';
  if (tagSlugs.some(t => /^(tipo-imagem|imagem|image|foto)$/.test(t))) return 'image';

  // inferência pela URL no excerpt
  const url = stripHtml(post.excerpt?.rendered || '').trim().toLowerCase();
  if (url.includes('canva.com'))        return 'iframe';
  if (url.includes('youtube.com') || url.includes('youtu.be')) return 'video';
  if (url.includes('vimeo.com'))        return 'video';
  if (url.endsWith('.pdf') || url.includes('drive.google.com')) return 'iframe';
  if (/\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/.test(url)) return 'image';

  return 'image'; // padrão
}

function normalizeUrl(url, type) {
  // Canva: converter link de compartilhamento para embed
  if (url.includes('canva.com/design') && !url.includes('/embed')) {
    url = url.split('?')[0]; // remove query string
    if (!url.endsWith('/view')) url = url.replace(/\/?$/, '/view');
    url = url.replace('/view', '/embed');
  }

  // Google Drive: converter /view para /preview
  if (url.includes('drive.google.com') && url.includes('/view')) {
    url = url.replace('/view', '/preview');
  }

  // YouTube: converter para embed
  if (url.includes('youtube.com/watch')) {
    const vid = new URL(url).searchParams.get('v');
    if (vid) url = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vid}`;
  } else if (url.includes('youtu.be/')) {
    const vid = url.split('youtu.be/')[1].split('?')[0];
    url = `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vid}`;
  }

  // Vimeo: converter para embed
  if (url.includes('vimeo.com/') && !url.includes('player.vimeo.com')) {
    const vid = url.split('vimeo.com/').pop().split('/')[0].split('?')[0];
    url = `https://player.vimeo.com/video/${vid}?autoplay=1&loop=1&muted=1`;
  }

  return url;
}

/* ═══════════════════════════════════════════════════════════
   PLAYER
═══════════════════════════════════════════════════════════ */
function startPlayer() {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-player').style.display  = 'block';
  rebuildDots();
  showItem(0);
  setupMouseOverlay();
}

function showItem(idx) {
  clearTimeout(slideTimer);
  currentIdx = ((idx % items.length) + items.length) % items.length;
  const item = items[currentIdx];

  /* atualizar UI */
  document.getElementById('content-title').textContent = item.title;
  document.getElementById('counter').textContent = `${currentIdx + 1} / ${items.length}`;
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentIdx)
  );

  /* renderizar conteúdo */
  renderContent(item);

  /* barra de progresso */
  animateProgress(item.duration);

  /* agendar próximo */
  if (!isPaused) {
    slideTimer = setTimeout(() => showItem(currentIdx + 1), item.duration * 1000);
  }
}

function renderContent(item) {
  const wrap = document.getElementById('content-wrap');
  wrap.innerHTML = '';

  if (item.type === 'image') {
    const img    = document.createElement('img');
    img.src      = item.url;
    img.alt      = item.title;
    img.onerror  = () => { img.style.display='none'; };
    wrap.appendChild(img);

  } else if (item.type === 'video' && !item.url.includes('youtube.com/embed') && !item.url.includes('player.vimeo')) {
    const vid      = document.createElement('video');
    vid.src        = item.url;
    vid.autoplay   = true;
    vid.loop       = true;
    vid.muted      = false;
    vid.controls   = false;
    vid.playsInline = true;
    wrap.appendChild(vid);
    vid.play().catch(() => { vid.muted = true; vid.play(); });

  } else {
    // iframe: Canva, PDF, YouTube embed, Vimeo embed, web
    const frame   = document.createElement('iframe');
    frame.src     = item.url;
    frame.allow   = 'autoplay; fullscreen; clipboard-write; encrypted-media';
    frame.setAttribute('allowfullscreen', '');
    frame.setAttribute('scrolling', 'no');
    wrap.appendChild(frame);
  }
}

function rebuildDots() {
  const container = document.getElementById('dots');
  container.innerHTML = '';
  items.forEach((item, i) => {
    const dot   = document.createElement('div');
    dot.className = 'dot' + (i === currentIdx ? ' active' : '');
    dot.title   = item.title;
    dot.onclick = () => showItem(i);
    container.appendChild(dot);
  });
}

function nextItem() {
  clearTimeout(slideTimer);
  showItem(currentIdx + 1);
}
function prevItem() {
  clearTimeout(slideTimer);
  showItem(currentIdx - 1);
}

/* ─ Barra de progresso ─ */
function animateProgress(duration) {
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${duration}s linear`;
    bar.style.width = '100%';
  }));
}

/* ─ Overlay de controles (aparece com movimento do mouse) ─ */
function setupMouseOverlay() {
  const overlay = document.getElementById('overlay');
  document.addEventListener('mousemove', () => {
    overlay.classList.add('visible');
    document.body.style.cursor = 'default';
    clearTimeout(overlayTimer);
    overlayTimer = setTimeout(() => {
      overlay.classList.remove('visible');
      document.body.style.cursor = 'none';
    }, OVERLAY_TIMEOUT);
  });
}

/* ─ Fullscreen ─ */
function toggleFullscreen() {
  const btn = document.getElementById('fs-btn');
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
    btn.textContent = '✕ Sair';
  } else {
    document.exitFullscreen();
    btn.textContent = '⛶ Tela Cheia';
  }
}
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fs-btn');
  if (btn) btn.textContent = document.fullscreenElement ? '✕ Sair' : '⛶ Tela Cheia';
});

/* ─ Teclado ─ */
document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowRight':
    case ' ':        nextItem();         break;
    case 'ArrowLeft': prevItem();        break;
    case 'f':
    case 'F':        toggleFullscreen(); break;
  }
});

/* ═══════════════════════════════════════════════════════════
   UTILITÁRIOS
═══════════════════════════════════════════════════════════ */
function stripHtml(html) {
  return html.replace(/<[^>]*>/g, '').replace(/&amp;/g,'&').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&#8230;/g,'').trim();
}

function setStatus(msg) {
  document.getElementById('status-text').innerHTML = msg;
}

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('status-text').innerHTML =
    `<span style="color:#ff7070;font-size:17px;display:block;margin-bottom:8px;">⚠ Atenção</span>${msg}`;
}
</script>
</body>
</html>
