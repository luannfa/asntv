<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Corporativa</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }

    /* ── LOADING / ERRO ── */
    #screen-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 20px;
      text-align: center;
      padding: 32px;
    }
    #screen-loading .logo { font-size: 56px; }
    #screen-loading .status {
      font-size: 15px;
      color: rgba(255,255,255,.55);
      max-width: 500px;
      line-height: 1.7;
    }
    .spinner {
      width: 36px; height: 36px;
      border: 3px solid rgba(255,255,255,.12);
      border-top-color: #2c83e9;
      border-radius: 50%;
      animation: spin .75s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── PLAYER ── */
    #screen-player {
      display: none;
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    #content-wrap {
      width: 100%; height: 100%;
      background: #000;
    }
    #content-wrap img {
      width: 100%; height: 100%;
      object-fit: contain;
      display: block;
    }
    #content-wrap video {
      width: 100%; height: 100%;
      object-fit: contain;
      background: #000;
      display: block;
    }
    #content-wrap iframe {
      width: 100%; height: 100%;
      border: none;
      display: block;
    }

    /* ── PROGRESSO ── */
    #progress-bar {
      position: fixed;
      bottom: 0; left: 0;
      height: 4px; width: 0%;
      background: #2c83e9;
      z-index: 200;
      transition: none;
    }

    /* ── OVERLAY ── */
    #overlay {
      position: fixed;
      inset: 0;
      z-index: 100;
      pointer-events: none;
      opacity: 0;
      transition: opacity .3s;
    }
    #overlay.visible {
      opacity: 1;
      pointer-events: all;
    }
    #topbar {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 22px;
      background: linear-gradient(to bottom, rgba(0,0,0,.75), transparent);
    }
    .channel-label {
      font-size: 11px;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255,255,255,.5);
    }
    .content-title {
      font-size: 13px;
      color: rgba(255,255,255,.7);
      max-width: 45%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .controls { display: flex; gap: 8px; }
    .ctrl-btn {
      background: rgba(255,255,255,.15);
      border: 1px solid rgba(255,255,255,.25);
      color: #fff;
      font-size: 12px;
      padding: 6px 14px;
      border-radius: 5px;
      cursor: pointer;
      transition: background .2s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { background: rgba(255,255,255,.3); }

    #dots {
      position: absolute;
      bottom: 18px; left: 50%;
      transform: translateX(-50%);
      display: flex; gap: 7px;
      max-width: 90vw;
      flex-wrap: wrap;
      justify-content: center;
    }
    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: rgba(255,255,255,.3);
      cursor: pointer;
      transition: background .2s, transform .2s;
    }
    .dot.active { background: #fff; transform: scale(1.35); }

    #counter {
      position: absolute;
      bottom: 14px; right: 20px;
      font-size: 11px;
      color: rgba(255,255,255,.35);
    }
  </style>
</head>
<body>

<div id="screen-loading">
  <div class="logo">📺</div>
  <div class="spinner" id="spinner"></div>
  <div class="status" id="status-text">Iniciando…</div>
</div>

<div id="screen-player">
  <div id="content-wrap"></div>
  <div id="overlay">
    <div id="topbar">
      <span class="channel-label" id="channel-label"></span>
      <span class="content-title" id="content-title"></span>
      <div class="controls">
        <button class="ctrl-btn" onclick="prevItem()">&#8592; Anterior</button>
        <button class="ctrl-btn" onclick="nextItem()">Próximo &#8594;</button>
        <button class="ctrl-btn" id="fs-btn" onclick="toggleFullscreen()">&#9974; Tela Cheia</button>
      </div>
    </div>
    <div id="dots"></div>
    <div id="counter"></div>
  </div>
</div>

<div id="progress-bar"></div>

<script>
/* ══════════════════════════════════════════════
   CONFIGURAÇÃO — altere apenas esta linha
══════════════════════════════════════════════ */
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vRT265YDAYO-AMMsoq1NYoCbi-1l3SsSKYjs-46BdG-1ULicxB-dwFnGBMKUWWzRB6AtdHjESGqQ0iR/pub?output=csv';
const DEFAULT_DURATION = 15;   // segundos padrão por item
const REFRESH_EVERY    = 120;  // recarregar planilha a cada X segundos
const OVERLAY_HIDE     = 3500; // ms para esconder controles

/* ══════════════════════════════════════════════
   ESTADO
══════════════════════════════════════════════ */
let items      = [];
let currentIdx = 0;
let slideTimer = null;
let overlayTmr = null;

/* ══════════════════════════════════════════════
   INICIALIZAÇÃO
══════════════════════════════════════════════ */
const params      = new URLSearchParams(window.location.search);
const channelSlug = (params.get('canal') || params.get('channel') || '').trim().toLowerCase();

if (!channelSlug) {
  showError(
    'Parâmetro <strong>canal</strong> não informado na URL.<br>' +
    'Exemplo: <code>tv-viewer.html?canal=recepcao</code>'
  );
} else {
  setStatus('Carregando programação…');
  loadData();
  setInterval(silentRefresh, REFRESH_EVERY * 1000);
}

/* ══════════════════════════════════════════════
   CARREGAMENTO DE DADOS
══════════════════════════════════════════════ */
async function fetchCSV() {
  // Tenta busca direta primeiro; se falhar, usa proxy CORS
  try {
    const res = await fetch(SHEET_CSV_URL + '&t=' + Date.now());
    if (res.ok) return await res.text();
  } catch (_) {}
  // Fallback: proxy CORS
  const proxy = 'https://api.allorigins.win/get?url=' + encodeURIComponent(SHEET_CSV_URL);
  const res2  = await fetch(proxy);
  const json  = await res2.json();
  return json.contents;
}

async function loadData() {
  try {
    const text = await fetchCSV();
    const rows = parseCSV(text);

    if (rows.length < 2) {
      showError('Planilha vazia ou sem dados. Adicione linhas na planilha.');
      return;
    }

    // Linha 0 = cabeçalho, demais = dados
    const header = rows[0].map(h => h.trim().toLowerCase());
    const col = {
      canal   : header.indexOf('canal'),
      titulo  : header.indexOf('titulo'),
      tipo    : header.indexOf('tipo'),
      url     : header.indexOf('url'),
      duracao : header.indexOf('duracao'),
    };

    const parsed = rows.slice(1)
      .filter(row => row[col.canal] && row[col.canal].trim().toLowerCase() === channelSlug)
      .map(row => ({
        title   : (row[col.titulo] || '').trim(),
        type    : (row[col.tipo]   || 'imagem').trim().toLowerCase(),
        url     : normalizeUrl((row[col.url] || '').trim(), (row[col.tipo] || '').trim().toLowerCase()),
        duration: parseInt(row[col.duracao], 10) || DEFAULT_DURATION,
      }))
      .filter(item => item.url);

    if (parsed.length === 0) {
      showError(
        `Nenhum conteúdo encontrado para o canal <strong>"${channelSlug}"</strong>.<br>` +
        `Verifique se a coluna <em>canal</em> da planilha tem exatamente esse valor.`
      );
      return;
    }

    items = parsed;

    document.getElementById('channel-label').textContent = channelSlug;
    document.title = `TV – ${channelSlug}`;

    startPlayer();

  } catch (err) {
    showError('Erro ao carregar a planilha: ' + err.message);
  }
}

async function silentRefresh() {
  try {
    const text = await fetchCSV();
    const rows = parseCSV(text);
    if (rows.length < 2) return;

    const header = rows[0].map(h => h.trim().toLowerCase());
    const col = {
      canal: header.indexOf('canal'), titulo: header.indexOf('titulo'),
      tipo: header.indexOf('tipo'), url: header.indexOf('url'), duracao: header.indexOf('duracao'),
    };

    const parsed = rows.slice(1)
      .filter(row => row[col.canal] && row[col.canal].trim().toLowerCase() === channelSlug)
      .map(row => ({
        title: (row[col.titulo] || '').trim(),
        type: (row[col.tipo] || 'imagem').trim().toLowerCase(),
        url: normalizeUrl((row[col.url] || '').trim(), (row[col.tipo] || '').trim().toLowerCase()),
        duration: parseInt(row[col.duracao], 10) || DEFAULT_DURATION,
      }))
      .filter(item => item.url);

    if (parsed.length > 0) {
      items = parsed;
      rebuildDots();
    }
  } catch (_) { /* silencioso */ }
}

/* ══════════════════════════════════════════════
   PARSER CSV  (suporta campos com vírgulas entre aspas)
══════════════════════════════════════════════ */
function parseCSV(text) {
  const rows = [];
  const lines = text.split(/\r?\n/);
  for (const line of lines) {
    if (!line.trim()) continue;
    const cols = [];
    let cur = '', inQuote = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') {
        if (inQuote && line[i+1] === '"') { cur += '"'; i++; }
        else inQuote = !inQuote;
      } else if (ch === ',' && !inQuote) {
        cols.push(cur); cur = '';
      } else {
        cur += ch;
      }
    }
    cols.push(cur);
    rows.push(cols);
  }
  return rows;
}

/* ══════════════════════════════════════════════
   NORMALIZAÇÃO DE URLs
══════════════════════════════════════════════ */
function normalizeUrl(url, type) {
  if (!url) return '';

  // YouTube watch → embed
  if (url.includes('youtube.com/watch')) {
    try {
      const vid = new URL(url).searchParams.get('v');
      if (vid) return `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vid}`;
    } catch(_) {}
  }
  if (url.includes('youtu.be/')) {
    const vid = url.split('youtu.be/')[1].split(/[?#]/)[0];
    return `https://www.youtube.com/embed/${vid}?autoplay=1&mute=1&controls=0&loop=1&playlist=${vid}`;
  }

  // Vimeo → embed
  if (url.includes('vimeo.com/') && !url.includes('player.vimeo')) {
    const vid = url.split('vimeo.com/').pop().split(/[?/#]/)[0];
    return `https://player.vimeo.com/video/${vid}?autoplay=1&loop=1&muted=1`;
  }

  // Canva → embed
  if (url.includes('canva.com/design') && !url.includes('/embed')) {
    const base = url.split('?')[0].replace(/\/(view|present|edit)\/?$/, '');
    return base + '/embed';
  }

  // Google Drive → imagem direta ou preview
  if (url.includes('drive.google.com')) {
    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/);
    if (idMatch) {
      const fileId = idMatch[1];
      if (type === 'imagem' || type === 'image') {
        // Imagem: usar URL direta
        return `https://drive.google.com/uc?export=view&id=${fileId}`;
      } else {
        // PDF, vídeo: usar preview
        return `https://drive.google.com/uc?export=view&id=${fileId}`;
      }
    }
  }

  return url;
}

/* ══════════════════════════════════════════════
   PLAYER
══════════════════════════════════════════════ */
function startPlayer() {
  document.getElementById('screen-loading').style.display = 'none';
  document.getElementById('screen-player').style.display  = 'block';
  rebuildDots();
  showItem(0);
  setupOverlay();
}

function showItem(idx) {
  clearTimeout(slideTimer);
  currentIdx = ((idx % items.length) + items.length) % items.length;
  const item = items[currentIdx];

  document.getElementById('content-title').textContent = item.title;
  document.getElementById('counter').textContent = `${currentIdx + 1} / ${items.length}`;
  document.querySelectorAll('.dot').forEach((d, i) =>
    d.classList.toggle('active', i === currentIdx)
  );

  renderContent(item);
  animateProgress(item.duration);
  slideTimer = setTimeout(() => showItem(currentIdx + 1), item.duration * 1000);
}

function renderContent(item) {
  const wrap = document.getElementById('content-wrap');
  wrap.innerHTML = '';

  const type = item.type;

  // Vídeo nativo (não YouTube/Vimeo)
  if ((type === 'video') &&
      !item.url.includes('youtube.com/embed') &&
      !item.url.includes('player.vimeo')) {
    const v = document.createElement('video');
    v.src = item.url; v.autoplay = true; v.loop = true;
    v.muted = false; v.controls = false; v.playsInline = true;
    wrap.appendChild(v);
    v.play().catch(() => { v.muted = true; v.play(); });
    return;
  }

  // Imagem
  if (type === 'imagem' || type === 'image' ||
      /\.(jpg|jpeg|png|gif|webp|svg)(\?|$)/i.test(item.url)) {
    const img = document.createElement('img');
    img.src = item.url; img.alt = item.title;
    wrap.appendChild(img);
    return;
  }

  // Iframe (YouTube embed, Vimeo, Canva, PDF, site, etc.)
  const frame = document.createElement('iframe');
  frame.src = item.url;
  frame.allow = 'autoplay; fullscreen; clipboard-write; encrypted-media';
  frame.setAttribute('allowfullscreen', '');
  frame.setAttribute('scrolling', 'no');
  wrap.appendChild(frame);
}

function rebuildDots() {
  const c = document.getElementById('dots');
  c.innerHTML = '';
  items.forEach((item, i) => {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentIdx ? ' active' : '');
    d.title = item.title;
    d.onclick = () => { clearTimeout(slideTimer); showItem(i); };
    c.appendChild(d);
  });
}

function nextItem() { clearTimeout(slideTimer); showItem(currentIdx + 1); }
function prevItem() { clearTimeout(slideTimer); showItem(currentIdx - 1); }

function animateProgress(duration) {
  const bar = document.getElementById('progress-bar');
  bar.style.transition = 'none';
  bar.style.width = '0%';
  requestAnimationFrame(() => requestAnimationFrame(() => {
    bar.style.transition = `width ${duration}s linear`;
    bar.style.width = '100%';
  }));
}

/* ══════════════════════════════════════════════
   OVERLAY / FULLSCREEN / TECLADO
══════════════════════════════════════════════ */
function setupOverlay() {
  const ov = document.getElementById('overlay');
  document.addEventListener('mousemove', () => {
    ov.classList.add('visible');
    document.body.style.cursor = 'default';
    clearTimeout(overlayTmr);
    overlayTmr = setTimeout(() => {
      ov.classList.remove('visible');
      document.body.style.cursor = 'none';
    }, OVERLAY_HIDE);
  });
}

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen().catch(() => {});
  } else {
    document.exitFullscreen();
  }
}
document.addEventListener('fullscreenchange', () => {
  const btn = document.getElementById('fs-btn');
  if (btn) btn.textContent = document.fullscreenElement ? '✕ Sair' : '⛶ Tela Cheia';
});

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') nextItem();
  else if (e.key === 'ArrowLeft') prevItem();
  else if (e.key === 'f' || e.key === 'F') toggleFullscreen();
});

/* ══════════════════════════════════════════════
   UTILITÁRIOS
══════════════════════════════════════════════ */
function setStatus(msg) { document.getElementById('status-text').innerHTML = msg; }

function showError(msg) {
  document.getElementById('spinner').style.display = 'none';
  document.getElementById('status-text').innerHTML =
    `<span style="color:#ff7070;font-size:17px;display:block;margin-bottom:10px;">⚠ Atenção</span>${msg}`;
}
</script>
</body>
</html>
